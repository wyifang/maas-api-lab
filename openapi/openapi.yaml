
openapi: 3.0.3

info:
  title: MaaS Demo API
  version: 1.0.0
  description: API documentation learning project.
  license:
    name: UNLICENSED


servers:
  - url: https://api.example.test/v1
    description: Placeholder server; not a live API

security:
  - BearerAuth: []

paths:
  /chat/completions:
    post:
      operationId: createChatCompletion
      summary: Create a chat completion
      description: Generate a response from a language model.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - messages
              properties:
                model:
                  type: string
                  description: Model identifier.
                  example: demo-chat
                messages:
                  type: array
                  items:
                    type: object
                    required:
                      - role
                      - content
                    properties:
                      role:
                        type: string
                        enum:
                          - user
                          - assistant
                          - system
                      content:
                        type: string
                temperature:
                  type: number
                  description: Controls the randomness of the model response.
                  minimum: 0
                  maximum: 2
                  example: 0.7

      responses:

        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - model
                  - choices
                properties:
                  id:
                    type: string
                  model:
                    type: string
                  choices:
                    type: array
                    items:
                      type: object
                      required:
                        - message
                      properties:
                        message:
                          type: object
                          required:
                            - role
                            - content
                          properties:
                            role:
                              type: string
                            content:
                              type: string


        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_request
                  message: The request parameters are invalid.

        '401':
          description: Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_api_key
                  message: The API key is invalid.

        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: rate_limit_exceeded
                  message: Too many requests.

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: internal_error
                  message: An internal server error occurred.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: Use your API token as a Bearer token.

  schemas:
      ErrorResponse:
        type: object
        required:
          - error
        properties:
          error:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: invalid_api_key
              message:
                type: string
                example: The API key is invalid.
